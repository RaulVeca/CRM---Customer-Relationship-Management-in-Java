# ============================================================
# Spring Boot / web application configuration
# ============================================================
# NOTE: secrets must NOT live here. The Anthropic API key is read from the
# ANTHROPIC_API_KEY environment variable (empty default below = AI disabled).

# AI (Claude) settings
crm.ai.api-key=${ANTHROPIC_API_KEY:}
# Default model. Switch to claude-haiku-4-5 to reduce demo costs.
crm.ai.model=claude-opus-4-8
crm.ai.max-tokens=2048

# CORS origin for the Next.js dev server
crm.cors.allowed-origins=http://localhost:3000
